<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InstaMark - Premium Watermark Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>

  <main class="container">
    <header>
      <h1>InstaMark</h1>
      <p>Secure your images and PDFs with a professional watermark instantly.</p>
    </header>

    <div class="card glass-panel">
      
      <div class="upload-area" id="drop-zone">
        <input type="file" id="file-input" accept="image/*,application/pdf" hidden>
        <div class="icon-container">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
        </div>
        <h3>Drop your image or PDF here</h3>
        <p>or <span class="browse-btn">browse</span> to upload</p>
        <p class="file-info" id="file-info"></p>
      </div>

      <div class="controls">
        <label for="watermark-text">Watermark Text</label>
        <div class="input-group">
          <input type="text" id="watermark-text" value="FOTOCOPY" placeholder="Enter text...">
        </div>
      </div>

      <button id="process-btn" class="btn-primary" disabled>
        <span class="btn-text">Add Watermark</span>
        <div class="spinner"></div>
      </button>

    </div>

    <!-- Preview Section (Hidden Initially) -->
    <div class="preview-card glass-panel hidden" id="result-section">
      <h3>Ready to Download!</h3>
      <div class="image-wrapper">
        <img id="preview-image" src="" alt="Watermarked Preview">
        <iframe id="preview-pdf" class="hidden" title="Watermarked PDF Preview"></iframe>
      </div>
      <div class="actions">
        <a id="download-link" href="#" class="btn-secondary" download>Download</a>
        <button id="reset-btn" class="btn-text-only">Process Another</button>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
